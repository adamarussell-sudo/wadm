# WADM roster: every show the station can play.
#
# tier:    love      plays about three times as often as fine
#          fine      capped at 2 plays a week
#          noise     low-rotation filler, at most 1 play a week
#          wildcard  new shows on trial; they only play in the wildcard slot
#                    (about every fifth play) and the late-night slots
#
# tags:    mystery     fills the first late-night slot, every night
#          night       fills the second late-night slot
#          night_only  never plays in daytime
#
# apple_id and feed are optional. The station looks up the feed address
# from Apple by ID, or by name if there's no ID, and remembers it.
#
# To move a show, change its tier and save. To drop one, delete it.

