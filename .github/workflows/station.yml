name: WADM on the air

on:
  schedule:
    - cron: "15 10 * * *"   # morning block, about 5-6 AM in Dayton
    - cron: "15 21 * * *"   # evening block, about 4-5 PM in Dayton
  workflow_dispatch:
    inputs:
      block:
        description: "Block to build (auto, am, pm)"
        default: auto

permissions:
  contents: write
  issues: write

concurrency:
  group: wadm
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the next block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          export WADM_BASE_URL="https://${owner}.github.io/${repo}"
          python -m wadm run --block "${{ github.event.inputs.block || 'auto' }}"

      - name: Save the schedule
        run: |
          git config user.name "WADM"
          git config user.email "wadm@users.noreply.github.com"
          git add state docs
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "On the air: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push
          fi
